<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <!-- Legacy hash-URL shim: pre-path-strategy links look like /#/share/abc.
       Rewrite them to the real path (base-href aware) before the Flutter
       engine reads the URL, so old links in chats and emails keep working. -->
  <script>
    if (location.hash.startsWith('#/')) {
      var base = document.querySelector('base').getAttribute('href') || '/';
      history.replaceState(null, '',
          base.replace(/\/$/, '') + location.hash.slice(1) + location.search);
    }
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Plan trips and build day-by-day itineraries with an AI travel assistant.">

  <!-- SEO / social sharing (app landing; per-trip share links are prerendered
       server-side via /api/v1/share-preview and don't use these). -->
  <link rel="canonical" href="https://goldentempotravel.com/app/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Anemos">
  <meta property="og:title" content="Anemos">
  <meta property="og:description" content="Plan trips and build day-by-day itineraries with an AI travel assistant.">
  <meta property="og:url" content="https://goldentempotravel.com/app/">
  <meta property="og:image" content="https://goldentempotravel.com/app/og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Anemos">
  <!-- ?v=2 busts nginx's year-long immutable cache on /app/icons/* (Anemos art) -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon: ?v=2 because Chrome's favicon cache is keyed by URL and
       refreshes lazily — new bytes at the same URL can stay stale for weeks. -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>Anemos</title>
  <link rel="manifest" href="manifest.json">
  <!-- Browser chrome tint (specs/dark-mode). Follows the OS preference only —
       deliberately not synced to the in-app choice. Both metas carry a media
       query: an unqualified meta matches every environment and, being first in
       tree order, would shadow the dark one. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#00695C">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#004D40">

  <!--
    Boot splash shown while flutter_bootstrap.js + main.dart.js download and
    the engine starts. Pixel-matched to the in-app SplashScreen (lib/screens/
    splash_screen.dart) — same gradient, mark geometry (96px bare light mark,
    no plate), and spinner position — so the flutter-first-frame handoff reads
    as one continuous screen. If you change dimensions here, change
    splash_screen.dart too.
  -->
  <style>
    html {
      /* Paints before/if the gradient parses — no white flash. */
      background-color: #00695C;
      height: 100%;
    }
    body {
      margin: 0;
      height: 100%;
      background: linear-gradient(to bottom right, #00897B, #004D40) fixed;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: linear-gradient(to bottom right, #00897B, #004D40);
      opacity: 1;
      transition: opacity 300ms ease-out;
      pointer-events: none;
    }
    #splash.splash-hidden { opacity: 0; }
    .splash-mark {
      position: absolute;
      top: 50%;
      left: 50%;
      /* The pulse animates `transform`, so the keyframes must repeat this
         centering translate or the animation stomps it. */
      transform: translate(-50%, -50%);
      width: 96px;
      height: 96px;
      display: grid;
      place-items: center;
      animation: splash-pulse 1.8s ease-in-out infinite alternate;
    }
    .splash-mark img {
      width: 96px;
      height: 96px;
      object-fit: contain;
    }
    @keyframes splash-pulse {
      from { transform: translate(-50%, -50%) scale(1); }
      to   { transform: translate(-50%, -50%) scale(1.04); }
    }
    .splash-spinner {
      position: absolute;
      top: calc(50% + 96px);
      left: 50%;
      width: 24px;
      height: 24px;
      margin: -12px 0 0 -12px;
      border: 2.5px solid rgba(255, 255, 255, 0.30);
      border-top-color: rgba(255, 255, 255, 0.95);
      border-radius: 50%;
      animation: splash-spin 1s linear infinite;
    }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
  </style>

</head>
<body>
  <div id="splash">
    <div class="splash-mark">
      <img src="splash/anemos_mark_light.png" alt="Anemos">
    </div>
    <div class="splash-spinner"></div>
  </div>

  <script>
    // Fade the boot splash out once Flutter paints its first frame (the in-app
    // SplashScreen, pixel-matched to the markup above).
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('splash-hidden');
      var remove = function () { splash.remove(); };
      splash.addEventListener('transitionend', remove, { once: true });
      setTimeout(remove, 600); // fallback if transitionend never fires
    });
  </script>

  <script>
    // Password-manager autofill shim (v3). Flutter web only gives the
    // *focused* text field a real DOM rect; its AutofillGroup siblings are
    // left at 0x0 (upstream flutter/flutter#61301, #127694). Password
    // managers run anti-phishing visibility checks per field — including an
    // occlusion check: elementFromPoint(field center) must return the field
    // itself (Bitwarden's DomElementVisibilityService; 1Password behaves
    // the same). elementFromPoint skips pointer-events:none elements, so
    // siblings must be pe:auto to qualify — and because the engine ignores
    // pointer events not targeted at its own surface, we intercept pointer
    // events on the siblings and re-dispatch clones at the engine element
    // beneath, so a user click on a sibling still focuses the right
    // Flutter field.
    (function () {
      // Perf gate (v3.3): the shim's expensive work (forced-reflow
      // getBoundingClientRect/getComputedStyle in sizeAutofillForm, the
      // 200 ms relay poll) only matters while an auth screen's autofill
      // form is in the DOM — those flt-text-editing-host form fields exist
      // ONLY on auth screens. `active` flips on via the capture-phase
      // focusin listener below and back off after ~25 consecutive relay
      // ticks (~5 s) find no autofill form. While dormant, non-auth
      // screens pay exactly one boolean read per mutation batch and run
      // NO polling interval.
      var active = false;
      var relayTimer = null;
      var idleTicks = 0;
      var AUTOFILL_PROBE =
          'flt-text-editing-host form input, flt-text-editing-host form textarea';
      var diagnosed = new WeakSet();
      var forwarded = new WeakSet();
      // Last value the engine is known to have ingested per input — kept in
      // sync by the input listener below; the relay poll compares against it.
      var lastSeen = new WeakMap();
      function logFillEvent(e) {
        // Verbose-level breadcrumbs for debugging real password-manager
        // behavior (DevTools console, "Verbose" filter, search "autofill").
        lastSeen.set(e.target, e.target.value || '');
        if (!active) return; // breadcrumbs only while an auth form is live
        console.debug('[autofill] ' + e.type +
            ' on ' + (e.target.getAttribute('autocomplete') || e.target.name) +
            ' len=' + (e.target.value || '').length +
            ' trusted=' + e.isTrusted +
            ' inputType=' + (e.inputType || '-'));
      }
      // 1Password writes values into the inputs WITHOUT dispatching DOM
      // events (Chrome still marks the fields autofilled, but Flutter's
      // engine only ingests values via events, so the fill never reached
      // Flutter state). Poll the autofill form's inputs and synthesize the
      // input event for any value that changed with no event — the engine's
      // own listener then ingests it. Duplicate delivery for event-ful
      // writes is harmless: same-value updates are dropped app-side.
      // The interval is NOT started at boot: focusin on an auth form starts
      // it (see the activation listener at the bottom) and ~25 consecutive
      // empty ticks (~5 s after the auth form leaves the DOM) stop it.
      function relayTick() {
        var probe = document.querySelector(AUTOFILL_PROBE);
        if (!probe) {
          if (++idleTicks >= 25) { // ~5 s with no auth form: go dormant
            active = false;
            clearInterval(relayTimer);
            relayTimer = null;
          }
          return;
        }
        idleTicks = 0;
        var fields = probe.form.querySelectorAll('input, textarea');
        for (var i = 0; i < fields.length; i++) {
          var el = fields[i];
          if (el.type === 'submit') continue;
          var value = el.value || '';
          if (!lastSeen.has(el)) {
            lastSeen.set(el, value);
            continue;
          }
          if (lastSeen.get(el) === value) continue;
          lastSeen.set(el, value);
          console.debug('[autofill] relay silent write on ' +
              (el.getAttribute('autocomplete') || el.name) +
              ' len=' + value.length);
          el.dispatchEvent(new InputEvent('input', {
            bubbles: true,
            composed: true,
            inputType: 'insertReplacementText',
            data: value,
          }));
        }
      }
      // A pointer event landed on a non-focused autofill input. Cancel it
      // (also suppresses the compatibility mouse events) and re-dispatch a
      // clone at whatever the engine has under that point, found by
      // momentarily making this input click-transparent.
      function forwardToFlutter(e) {
        var el = e.currentTarget;
        if (el.classList.contains('flt-text-editing')) return; // now focused
        e.preventDefault();
        e.stopImmediatePropagation();
        el.style.pointerEvents = 'none';
        var under = document.elementFromPoint(e.clientX, e.clientY);
        el.style.pointerEvents = 'auto';
        if (!under || under === el) return;
        under.dispatchEvent(new e.constructor(e.type, {
          bubbles: true,
          cancelable: true,
          composed: true,
          view: window,
          detail: e.detail,
          clientX: e.clientX,
          clientY: e.clientY,
          screenX: e.screenX,
          screenY: e.screenY,
          button: e.button,
          buttons: e.buttons,
          pointerId: e.pointerId,
          pointerType: e.pointerType,
          isPrimary: e.isPrimary,
        }));
      }
      function sizeAutofillForm() {
        if (!active) return; // dormant off auth screens (perf gate above)
        var focused = document.querySelector(
            'form input.flt-text-editing, form textarea.flt-text-editing');
        if (!focused || !focused.form) return;
        var rect = focused.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        var fields = Array.prototype.filter.call(
            focused.form.querySelectorAll('input, textarea'),
            function (el) { return el.type !== 'submit'; });
        var focusedIdx = fields.indexOf(focused);
        var minY = rect.top;
        var maxY = rect.top + rect.height;
        fields.forEach(function (el, i) {
          if (!diagnosed.has(el)) {
            diagnosed.add(el);
            el.addEventListener('input', logFillEvent);
            el.addEventListener('change', logFillEvent);
          }
          // Chrome paints an opaque pale-blue -internal-autofill-selected
          // background (and forces text color) on autofilled inputs — a UA
          // style that ignores background:transparent, which turned filled
          // fields into blue bars covering the canvas text. The endless
          // background transition is the standard way to keep it from ever
          // appearing; text-fill-color keeps the DOM text invisible so only
          // the canvas-rendered text shows.
          if (!el.style.transition) {
            el.style.transition =
                'background-color 600000s 0s, background-image 600000s 0s';
            el.style.webkitTextFillColor = 'transparent';
          }
          var y = rect.top + (i - focusedIdx) * (rect.height + 40);
          if (el !== focused) {
            if (el.offsetWidth <= 0 && el.offsetHeight <= 0) {
              el.style.position = 'absolute';
              el.style.top = '0px';
              el.style.left = '0px';
              el.style.transform =
                  'translate(' + rect.left + 'px, ' + y + 'px)';
              el.style.width = rect.width + 'px';
              el.style.height = rect.height + 'px';
            } else {
              y = el.getBoundingClientRect().top;
            }
            // pe:auto (not none) so elementFromPoint returns the field and
            // the extensions' occlusion check passes; the pointer listeners
            // hand real user clicks back to the engine.
            el.style.pointerEvents = 'auto';
            if (!forwarded.has(el)) {
              forwarded.add(el);
              el.addEventListener('pointerdown', forwardToFlutter);
              el.addEventListener('pointerup', forwardToFlutter);
            }
          }
          minY = Math.min(minY, y);
          maxY = Math.max(maxY, y + rect.height);
        });
        // Extensions treat 0x0 forms as hidden/honeypot forms and skip
        // their fields — give the form itself a real size. It must stay
        // static AND unmargined at its natural spot: positioning it would
        // make it the containing block for the engine's absolutely-placed
        // inputs, and empirically even margins break the engine's
        // focus-switch between fields. pointer-events:none keeps the sized
        // box click-transparent; inputs win pe back explicitly above.
        var form = focused.form;
        if (form.offsetWidth <= 0 || form.offsetHeight <= 0) {
          form.style.width = rect.width + 'px';
          form.style.height = (maxY - minY) + 'px';
          form.style.pointerEvents = 'none';
        }
        if (getComputedStyle(focused).pointerEvents === 'none') {
          focused.style.pointerEvents = 'auto';
        }
      }
      // Run synchronously inside the observer callback: our observer is
      // registered before extension content scripts, so the fields are
      // already sized when the extension's own observer sees the same
      // mutation batch and analyzes the form. The observer stays
      // registered permanently to preserve that ordering guarantee — the
      // `active` gate (not observer teardown) is what makes non-auth
      // screens cheap.
      new MutationObserver(function () {
        if (!active) return; // dormant: one boolean read per mutation batch
        sizeAutofillForm();
      }).observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['style', 'class'],
      });
      // Activation: permanent capture-phase focusin listener (event-driven,
      // cheap). Auth-screen text fields are the only ones Flutter mounts
      // inside a flt-text-editing-host <form> (AutofillGroup), so a focusin
      // with that probe present means an auth screen is up: wake the shim
      // and start the relay poll. Focus lands synchronously in the same
      // task that inserts the form, so the fields are sized here before
      // any observer (ours or an extension's) processes that mutation
      // batch — the ordering guarantee above still holds while gated.
      document.addEventListener('focusin', function () {
        if (!active && document.querySelector(AUTOFILL_PROBE)) {
          active = true;
          idleTicks = 0;
          if (relayTimer === null) relayTimer = setInterval(relayTick, 200);
        }
        sizeAutofillForm();
      }, true);
    })();
  </script>

  <!-- Flutter initialization: build-generated bootstrap (inlines the loader,
       the build config, and the injected service-worker version — verified in
       build/web/flutter_bootstrap.js). Replaces the deprecated
       serviceWorkerVersion/loadEntrypoint pattern, which Flutter 3.35 warns
       about at build time. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
