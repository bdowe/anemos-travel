<!-- Render harness: browser favicon — the mark at 125% of a 1024 transparent
     square, so the ROSE (not the artboard) fills ~95% of the icon.

     A favicon is 16–32 real pixels and gets no clear space from the browser:
     the tab strip supplies its own. Rendering mark.svg at 100% therefore spent
     24% of those pixels on the artwork's own margin and put a 12px rose in a
     16px tab — the reason the mark read as a smudge next to sites whose icons
     go edge to edge.

     125% is the crop that stops just short of clipping: the rose's cardinal
     blades land ~2% inside the canvas, and what does run off the left and
     right edges is the route thread's hairline tails, which had already
     antialiased to nothing at this size. A thread leaving the frame reads as
     a route continuing past it, which is the mark's whole idea.

     NOT shared with the PWA/maskable icons: those are masked and padded by the
     platform, so they crop to their own safe zones (icon84.html,
     maskable.html). Screenshot at --window-size=1024,1024. -->
<!doctype html>
<html><head><style>
  html,body{margin:0;padding:0;background:transparent}
  .frame{width:1024px;height:1024px;overflow:hidden;
         display:flex;align-items:center;justify-content:center}
  img{width:1280px;height:1280px;flex:none}
</style></head>
<body><div class="frame"><img src="../mark.svg"></div></body></html>
