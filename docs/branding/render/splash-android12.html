<!-- Render harness: Android 12+ splash icon seed (flutter_native_splash
     android_12.image) — light mark at 768px centered on a transparent
     1152×1152 canvas. Android 12+ masks the icon to a 768px circle inside
     the 1152px bounds; the rose's tips span ~717px, so it fits the safe
     zone by construction. -->
<!doctype html>
<html><head><style>
  html,body{margin:0;padding:0;background:transparent}
  .frame{width:1152px;height:1152px;
         display:flex;align-items:center;justify-content:center}
  img{width:768px;height:768px}
</style></head>
<body><div class="frame"><img src="../mark-light.svg"></div></body></html>
