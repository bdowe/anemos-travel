<!-- Render harness: link-unfurl OG card, 1200×630. Teal app gradient,
     Threaded Bezel mark (bronze pops on teal), wordmark + tagline. -->
<!doctype html>
<html><head><style>
  @font-face{
    font-family:'Cormorant Garamond';
    font-weight:600;
    src:url('../../../src/packages/flutter-app/assets/fonts/CormorantGaramond-SemiBold.ttf') format('truetype');
  }
  html,body{margin:0;padding:0}
  .card{width:1200px;height:630px;display:flex;align-items:center;gap:72px;
        padding:0 96px;box-sizing:border-box;
        background:linear-gradient(135deg,#00897B 0%,#004D40 100%)}
  .badge{width:300px;height:300px;background:rgba(255,255,255,.94);
         border-radius:60px;flex:none;
         display:flex;align-items:center;justify-content:center;
         box-shadow:0 24px 60px rgba(0,0,0,.25)}
  .badge img{width:220px;height:220px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;color:#FFFFFF;
     font-size:120px;margin:0 0 18px;letter-spacing:4px}
  p{font-family:'Cormorant Garamond',serif;font-weight:600;color:#B2DFDB;
    font-size:44px;margin:0;letter-spacing:1px}
</style></head>
<body>
  <div class="card">
    <div class="badge"><img src="../mark.svg"></div>
    <div><h1>ANEMOS</h1><p>Plan less. Travel more.</p></div>
  </div>
</body></html>
