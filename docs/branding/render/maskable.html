<!-- Render harness: PWA maskable icon — the mark on solid white, sized so
     every platform mask (circle, squircle, rounded square) keeps the whole
     bezel, rose and route thread inside the safe zone.

     The spec's guaranteed-visible region is a CIRCLE of 80% of the icon's
     width, so the binding constraint is the ink's furthest RADIUS from
     centre, not its bounding-box width. Those differ here: the rose's
     cardinal blades punch through the bezel ring and the route thread
     overshoots it diagonally, so the ink reaches past the artboard's own
     inscribed circle — 0.5185 × the mark's drawn width, measured on the
     rendered art. That puts the ceiling at

       0.5185 × scale ≤ 0.40 × 1024   →   scale ≤ 790px

     790 of 1024 (77%) takes it exactly, landing the ink at 73% of the icon.

     Up from 655 (ink 48.6%) under the old bare-rose mark, which reserved the
     safe zone against the ARTBOARD and then spent that mark's own 24% margin
     on top of it, shipping a launcher icon that was half empty white. The
     bezel is both fuller and radially tighter than the bare rose (whose tails
     swung out to 0.571), so it gains twice over.

     Do not size this by the ink's bounding-box WIDTH — that reading was tried
     on the previous mark and put 508 pixels outside the circle.

     Screenshot at --window-size=1024,1024; also the seed
     flutter_launcher_icons reads for iOS/Android/macOS/Windows. -->
<!doctype html>
<html><head><style>
  html,body{margin:0;padding:0;background:#FFFFFF}
  .frame{width:1024px;height:1024px;display:flex;align-items:center;justify-content:center}
  img{width:790px;height:790px}
</style></head>
<body><div class="frame"><img src="../mark.svg"></div></body></html>
