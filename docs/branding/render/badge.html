<!-- Render harness: native-splash badge (flutter_native_splash seed) —
     mark at 72% on a white rounded square, mirroring the web splash
     .splash-badge look. 480×480, transparent outside the badge. -->
<!doctype html>
<html><head><style>
  html,body{margin:0;padding:0;background:transparent}
  .badge{width:480px;height:480px;background:#FFFFFF;border-radius:96px;
         display:flex;align-items:center;justify-content:center}
  img{width:346px;height:346px}
</style></head>
<body><div class="badge"><img src="../mark.svg"></div></body></html>
