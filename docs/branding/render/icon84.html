<!-- Render harness: PWA icon — content at 84% of a 1024 transparent square
     (the historical Icon-512 convention), measured on the mark's INK rather
     than on its artboard.

     mark.svg's ink (bezel ring, rose, thread) is 94.2% of its own square
     canvas, so drawing the artboard at 84% would put the ink at
     84% × 94.2% = 79% — close, but a hair under the convention. 913 of 1024
     (89.2%) lands the ink on 84% exactly.

     The correction is small because the Threaded Bezel nearly fills its
     artboard. Under the bare Waypoint Thread rose this harness was badly
     wrong: that mark's ink was only 76% of its canvas, so an 84% artboard
     drew a 64% icon and every home screen showed a small logo on a large
     empty tile.

     Screenshot at --window-size=1024,1024; downscaled to 192 by
     brand-render.sh. -->
<!doctype html>
<html><head><style>
  html,body{margin:0;padding:0;background:transparent}
  .frame{width:1024px;height:1024px;overflow:hidden;
         display:flex;align-items:center;justify-content:center}
  img{width:913px;height:913px;flex:none}
</style></head>
<body><div class="frame"><img src="../mark.svg"></div></body></html>
